name: Build K118 APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract and Fix Project
        run: |
          rm -rf temp
          unzip -o K118-Android-JetpackCompose-Project.zip -d temp
          PROJECT_DIR=$(find temp -name "gradlew" -type f | head -n 1 | xargs dirname)
          echo "Found project at $PROJECT_DIR"
          cp -a $PROJECT_DIR/. ./
          ls -la
          mkdir -p gradle
          cat > gradle/libs.versions.toml <<'EOF'
          [versions]
          agp = "8.2.2"
          kotlin = "1.9.22"
          google-services = "4.4.1"
          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          android-library = { id = "com.android.library", version.ref = "agp" }
          kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          google-gms-google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
          [libraries]
          androidx-core-ktx = "androidx.core:core-ktx:1.12.0"
          androidx-activity-compose = "androidx.activity:activity-compose:1.8.2"
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version = "2024.02.00" }
          EOF
          chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K118-APK
          path: app/build/outputs/apk/debug/*.apk
