name: Build K118 APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix project from ZIP
        run: |
          rm -rf temp_extract app gradle gradlew
          ZIPFILE=$(ls *.zip 2>/dev/null | head -n 1)
          unzip -o "$ZIPFILE" -d temp_extract
          APP_DIR=$(find temp_extract -type d -name "app" | head -n 1)
          cp -r "$APP_DIR" ./app
          GRADLEW=$(find temp_extract -type f -name "gradlew" | head -n 1)
          cp "$GRADLEW" ./gradlew
          GRADLE_DIR=$(find temp_extract -type d -name "gradle" | head -n 1)
          cp -r "$GRADLE_DIR" ./
          cp temp_extract/*/build.gradle* ./ 2>/dev/null || true
          cp temp_extract/*/settings.gradle* ./ 2>/dev/null || true
          cp temp_extract/build.gradle* ./ 2>/dev/null || true
          cp temp_extract/settings.gradle* ./ 2>/dev/null || true
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: K118-APK
          path: app/build/outputs/apk/debug/*.apk
