name: Build K118 APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract project
        run: |
          unzip -o K118-Android-JetpackCompose-Project.zip -d temp
          PROJECT=$(find temp -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          echo "Found at $PROJECT"
          cp -r $PROJECT/app ./
          cp $PROJECT/*.kts ./ || true
          cp $PROJECT/*.properties ./ || true
          cp -r $PROJECT/gradle ./ || true
          ls -la
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: K118-APK
          path: app/build/outputs/apk/debug/*.apk
