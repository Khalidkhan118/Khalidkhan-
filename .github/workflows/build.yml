name: Build K118 APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix project from ZIP
        run: |
          rm -rf app gradle gradlew build.gradle.kts settings.gradle.kts gradle.properties temp_extract
          ZIPFILE=$(ls *.zip | head -n 1)
          echo "ZIP is $ZIPFILE"
          unzip -o "$ZIPFILE" -d temp_extract
          PROJECT_DIR=$(find temp_extract -name "settings.gradle.kts" | head -n 1 | xargs dirname)
          echo "Project dir is $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          cp -r "$PROJECT_DIR/app" ./app
          cp "$PROJECT_DIR/gradlew" ./gradlew
          cp -r "$PROJECT_DIR/gradle" ./gradle
          cp "$PROJECT_DIR/build.gradle.kts" ./build.gradle.kts || true
          cp "$PROJECT_DIR/settings.gradle.kts" ./settings.gradle.kts || true
          cp "$PROJECT_DIR/gradle.properties" ./gradle.properties || true
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: K118-APK
          path: app/build/outputs/apk/debug/*.apk
