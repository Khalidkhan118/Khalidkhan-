name: Build K118 APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix project from ZIP
        run: |
          rm -rf app temp_extract
          ZIPFILE=$(ls *.zip | head -n 1)
          unzip -o "$ZIPFILE" -d temp_extract
          APP_PATH=$(find temp_extract -type d -name "app" | head -n 1)
          PROJECT_DIR=$(dirname "$APP_PATH")
          echo "Found project at $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          cp -r "$PROJECT_DIR/app" ./app
          cp "$PROJECT_DIR/build.gradle.kts" ./ 2>/dev/null || true
          cp "$PROJECT_DIR/settings.gradle.kts" ./ 2>/dev/null || true
          cp "$PROJECT_DIR/gradle.properties" ./ 2>/dev/null || true
