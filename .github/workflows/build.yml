name: Build K118 APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Project
        run: |
          rm -rf app build
          unzip -o K118-Android-JetpackCompose-Project.zip -d temp
          echo "Finding project..."
          find temp -type f | head -n 20
          ROOT=$(find temp -name "gradlew" | head -n 1 | xargs dirname)
          echo "Project ROOT is $ROOT"
          cp -r $ROOT/. ./
          chmod +x ./gradlew
          ls -la

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: K118-APK
          path: app/build/outputs/apk/debug/*.apk
