name: Build K118 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract K118 Project
        run: |
          set -e

          rm -rf temp
          unzip -o K118-Android-JetpackCompose-Project.zip -d temp

          echo "Project contents:"
          find temp/k118-android -maxdepth 2 -type f | sort

          cp -a temp/k118-android/. ./

          echo "Root project:"
          ls -la

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build K118 APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload K118 APK
        uses: actions/upload-artifact@v4
        with:
          name: K118-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
