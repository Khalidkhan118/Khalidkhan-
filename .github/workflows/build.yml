name: Build K118 APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Extract K118 Project
        shell: bash
        run: |
          rm -rf temp
          mkdir -p temp
          unzip -o K118-Android-JetpackCompose-Project.zip -d temp
          WRAPPER=$(find temp -type f -name "gradlew" | head -1)
          PROJECT_DIR=$(dirname "$WRAPPER")
          cp -a "$PROJECT_DIR"/. ./
          ls -la
      - name: Build K118 APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload K118 APK
        uses: actions/upload-artifact@v4
        with:
          name: K118-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
