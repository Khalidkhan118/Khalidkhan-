name: Build K118 APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Extract K118 Project
        shell: bash
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -1)
          echo "ZIP: $ZIP"
          rm -rf temp
          mkdir -p temp
          unzip -o "$ZIP" -d temp
          PROJECT_DIR=$(find temp -type f -name "settings.gradle.kts" | head -1 | xargs dirname)
          echo "PROJECT_DIR: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          cp -a "$PROJECT_DIR"/. ./
          ls -la
      - name: Build K118 APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload K118 APK
        uses: actions/upload-artifact@v4
        with:
          name: K118-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
