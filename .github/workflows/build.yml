name: Build K118 APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix project structure from ZIP
        run: |
          if [ ! -d "app" ]; then
            for z in *.zip K118*.zip; do
              if [ -f "$z" ]; then
                unzip -o "$z" -d temp_extract
                break
              fi
            done
            APP_DIR=$(find temp_extract -type d -name "app" | head -n 1)
            cp -r "$APP_DIR" ./app
            GRADLE_DIR=$(find temp_extract -type d -name "gradle" | head -n 1)
            cp -r "$GRADLE_DIR" ./ 2>/dev/null || true
            find temp_extract -maxdepth 4 -name "gradlew" -exec cp {} ./ \; 2>/dev/null || true
          fi
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Make gradlew executable
        run: chmod +x gradlew
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K118-APK
          path: app/build/outputs/apk/debug/*.apk
