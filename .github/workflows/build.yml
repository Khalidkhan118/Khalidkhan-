name: Build K118 APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Project Properly
        run: |
          unzip -o K118-Android-JetpackCompose-Project.zip -d temp
          PROJECT=$(find temp -name "libs.versions.toml" | head -n 1 | xargs dirname | xargs dirname)
          echo "Project at $PROJECT"
          cp -r $PROJECT/* ./ || true
          cp -r $PROJECT/gradle ./ || true
          cp $PROJECT/gradlew ./ || true
          chmod +x gradlew
          ls -la gradle/

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: K118-APK
          path: app/build/outputs/apk/debug/*.apk
